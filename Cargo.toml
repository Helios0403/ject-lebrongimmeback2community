[package]
name = "ject-justice"
version = "0.6.1-justice.0"
edition = "2021"
description = "An inclusive Ject fork affirming LGBTQIA+ inclusion and Black Lives Matter, with readable syntax, native numeric arrays, and a native GUI module."
license = "MIT"
readme = "README.md"
keywords = ["scripting", "language", "interpreter", "repl", "inclusive", "black-lives-matter"]
categories = ["command-line-utilities", "compilers"]
authors = ["Leo", "Ject Justice contributors"]

[dependencies]
rustc-hash = "1.1"
smallvec = "1.10"
rustyline = "12.0"
ctrlc = "3.5"
serde_json = "1.0"
colored = "2.0"
ndarray = "0.15"
rand = "0.8"
eframe = "0.34.2"
